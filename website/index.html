<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon/favicon-16x16.png" sizes="16x16" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <script>
      {
        const saved = localStorage.getItem('rspress-theme-appearance');
        const theme = saved === 'light' || saved === 'dark' || saved === 'auto' ? saved : 'auto';
        const dark =
          theme === 'dark' ||
          (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.moduixColorScheme = dark ? 'dark' : 'light';
        const preset = localStorage.getItem('moduix.preset');
        if (preset && preset !== 'calm') document.documentElement.dataset.moduixTheme = preset;
      }
    </script>
    <!--<?- GENERATOR ?>-->
    <!--<?- HEAD ?>-->
  </head>

  <body>
    <div id="__rspress_root"><!--<?- DOC_CONTENT ?>--></div>
  </body>
</html>
