name: Changeset Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changeset-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    name: Require changeset for releasable package changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changeset
        shell: bash
        run: |
          set -euo pipefail

          base_ref="${{ github.base_ref }}"
          git fetch origin "${base_ref}" --depth=1

          changed_files="$(git diff --name-only "origin/${base_ref}"...HEAD)"
          releasable_files="$(
            printf '%s\n' "${changed_files}" |
              grep -E '^packages/(foundation/src/|(react|solid)(-tailwind)?/(package\.json|rslib\.config\.ts|tsconfig(\.build)?\.json|README\.md|LICENSE\.md|THIRD_PARTY_NOTICES\.md|src/))' |
              grep -Ev '/(stories|tests)/|/src/components/.+\.md$' || true
          )"
          changeset_files="$(
            printf '%s\n' "${changed_files}" |
              grep -E '^\.changeset/[^/]+\.md$' |
              grep -vx '.changeset/README.md' || true
          )"

          if [[ -z "${releasable_files}" ]]; then
            echo "No releasable package changes detected."
            exit 0
          fi

          if [[ -n "${changeset_files}" ]]; then
            echo "Changeset found."
            exit 0
          fi

          echo "::error::Releasable package changes require a changeset."
          echo "Run 'pnpm run changeset' and commit the generated file."
          exit 1