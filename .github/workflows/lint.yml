name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Check lint
        run: pnpm run lint:check

      - name: Build React
        run: pnpm run build:react

      - name: Run tests
        run: pnpm run test

      - name: Check TypeScript
        run: pnpm run tsc:check

      - name: Build docs
        run: pnpm run build:docs

      - name: Build registry
        run: pnpm run build:registry

      - name: Check generated registry
        run: git diff --exit-code -- website/docs/public/r/react

      - name: Check package contract
        run: pnpm run check:package