name: Release

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR or publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          require-lockfile: true

      # Publishing authenticates through npm trusted publishing (OIDC). Every published
      # package must list this repository and workflow as a trusted publisher in its npm
      # settings; NPM_CONFIG_PROVENANCE additionally attaches a provenance attestation.
      - name: Create release PR or publish packages
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run changeset:version
          publish-script: pnpm run changeset:release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: true
          push-git-tags: true
        env:
          NPM_CONFIG_PROVENANCE: true