name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          require-lockfile: true

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Check lint
        run: pnpm run lint:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          require-lockfile: true

      - name: Run tests
        run: pnpm run test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          require-lockfile: true

      - name: Check TypeScript
        run: pnpm run tsc:check

  build:
    name: Build and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          require-lockfile: true

      - name: Build public packages
        run: pnpm run build:packages

      - name: Build docs
        run: pnpm run build:docs

      - name: Build registry
        run: pnpm run build:registry

      - name: Check generated registry
        run: git diff --exit-code -- website/docs/public/r

      - name: Check public package contracts
        run: pnpm run check:packages

  storybook:
    name: Storybook smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          require-lockfile: true

      - name: Build React playground storybook
        run: pnpm --filter @moduix/playground-react build:storybook

      - name: Build React Tailwind playground storybook
        run: pnpm --filter @moduix/playground-react-tailwind build:storybook