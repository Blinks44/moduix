version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node.js 24 runtime declared in package.json.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Vue SFC tooling does not support TypeScript 7 yet; React and Solid packages opt in directly.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Vue language tools are pinned until https://github.com/vuejs/language-tools/issues/6240 is fixed.
      - dependency-name: '@vue/language-core'
      - dependency-name: '@vue/language-server'
      - dependency-name: 'vue-tsc'
      # Solid adapters target Solid 1.x; Solid 2 requires a dedicated migration.
      - dependency-name: 'solid-js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@rsbuild/plugin-solid'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /starters/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vue-tsc'
      - dependency-name: 'solid-js'
        update-types: ['version-update:semver-major']
    groups:
      starters-minor-and-patch:
        update-types:
          - minor
          - patch